<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050B18" />
    <title>Offline — PostPylot</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #050b18;
        color: #cbd5e1;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: 24rem;
        width: 100%;
        text-align: center;
        padding: 2rem 1.5rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(7, 26, 47, 0.8);
      }

      .logo {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #2563eb 0%, #22d3ee 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 0.875rem;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #ffffff;
        background: #2563eb;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">PostPylot</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        PostPylot needs an internet connection to load new pages. Check your
        connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
